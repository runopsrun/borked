<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="w-bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#2a0f3a"/>
      <stop offset="0.55" stop-color="#140b22"/>
      <stop offset="1" stop-color="#07060c"/>
    </radialGradient>
    <linearGradient id="w-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d81"/>
      <stop offset="0.55" stop-color="#a14dff"/>
      <stop offset="1" stop-color="#2de2e6"/>
    </linearGradient>
    <pattern id="w-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
    <filter id="w-blur"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="w-left"><polygon points="0,0 35,0 29,21 37,33 27,47 31,64 0,64"/></clipPath>
    <clipPath id="w-right"><polygon points="35,0 64,0 64,64 31,64 27,47 37,33 29,21"/></clipPath>
    <g id="w-mark">
      <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#w-grad)"/>
      <path fill="#0b0a12" fill-rule="evenodd" d="
        M20 14 H32 C37.5 14 41 17 41 22.5 C41 25.5 39.6 27.6 37.4 28.8
        C40.8 30 43 33 43 37.5 C43 44 39 50 32.5 50 H20 Z
        M26.5 20 V27 H31.5 C33.8 27 35 25.8 35 23.5 C35 21.2 33.8 20 31.5 20 Z
        M26.5 33 V44 H32 C35 44 36.6 42 36.6 38.5 C36.6 35 35 33 32 33 Z"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#w-bg)"/>
  <circle cx="760" cy="420" r="300" fill="#ff3d81" opacity="0.18" filter="url(#w-blur)"/>
  <circle cx="1160" cy="640" r="320" fill="#2de2e6" opacity="0.12" filter="url(#w-blur)"/>

  <!-- faint glitch slabs -->
  <g opacity="0.35">
    <rect x="0" y="212" width="640" height="3" fill="#2de2e6"/>
    <rect x="1340" y="318" width="580" height="2" fill="#ff3d81"/>
    <rect x="220" y="802" width="420" height="6" fill="#a14dff"/>
    <rect x="1180" y="886" width="740" height="2" fill="#2de2e6"/>
  </g>

  <!-- the mark, scaled up -->
  <g transform="translate(800 280) scale(5)">
    <g clip-path="url(#w-left)"><use href="#w-mark"/></g>
    <g transform="translate(2.5 -2.5)"><g clip-path="url(#w-right)"><use href="#w-mark"/></g></g>
  </g>

  <text x="960" y="760" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="64" letter-spacing="4" fill="#f4f0ff">Borked</text>
  <text x="960" y="808" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" letter-spacing="8" fill="#8f88a8">BEAUTIFULLY BROKEN</text>

  <rect width="1920" height="1080" fill="url(#w-scan)"/>
</svg>
